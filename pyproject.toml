[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-workforge"
version = "0.1.0"
description = "Cross-platform observability and control for autonomous AI work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chimthuwu" }]
keywords = ["agents", "observability", "mission-control", "hermes", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "rich>=13.7",
  "websockets>=12",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
test = ["pytest>=8"]

[project.scripts]
workforge = "workforce.cli:main"

[project.urls]
Homepage = "https://github.com/Chimthuwu/hermes-workforge"
Repository = "https://github.com/Chimthuwu/hermes-workforge"

[tool.setuptools.packages.find]
include = ["workforce*"]
